<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Graphiques</title>
</head>
<body class="bg-white text-black">

<div class="container text-black">
    <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="col-12 col-md-8 col-lg-6 text-center">

            <h1>Graphiques</h1>

            <div class="mb-3">
                <div class="bg-primary p-2 rounded mt-3 d-inline-flex justify-content-center gap-3 flex-wrap">
                    <a href="/Home" class="text-white text-decoration-none">Home</a>
                    <a href="/Dechet" class="text-white text-decoration-none">Dechet</a>
                    <a href="/BDD" class="text-white text-decoration-none">BDD</a>
                    <a href="/Menu" class="text-white text-decoration-none">Menu</a>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Type de déchets</label>
                <select id="ChoixGraphique" name="ChoixGraphique" class="form-select" required>
                    <option value="Plastique">Plastique</option>
                    <option value="Organique">Organique</option>
                </select>
            </div>

            <form id="Periode" method="POST" action="Periode" class="mb-3">
                <label class="form-label">Choix de la semaine</label>
                <input id="date_debut" type="date" name="date_debut" class="form-control mb-2">
                <input id="date_fin" type="date" name="date_fin" class="form-control">
            </form>

            <div class="mt-4 bg-white p-1 rounded border border-primary border-3">
                <div class="chart-container" style="height: 400px;">
                    <canvas id="GraphPoid"></canvas>
                </div>
            </div>
            

        </div>
    </div>
</div>

<script>
let chart;

async function loadGraphData(type,date_debut,date_fin) {
    const response = await fetch(`/API/Data_BDD?type=${type}&date_debut=${date_debut}&date_fin=${date_fin}`);
    const data = await response.json();

    const labels = data.map(row =>
        new Date(row.DateDeCollecte).toLocaleDateString()
    );

    const dataPoid = data.map(row => row.Valeur);

    if(chart)chart.destroy();

    chart = new Chart(document.getElementById('GraphPoid'), {
    type: 'line',
    data: {
        labels,
        datasets: [{
            label: `Déchets ${type} (Kg)`,
            data: dataPoid,
            borderColor: 'blue',
            backgroundColor: 'rgba(0,128,0,0.2)',
            fill: true,
            tension: 0.4,
            segment: {
                borderColor: ctx => {
                    const y = ctx.p0.parsed.y;
                    return y > 90 ? 'red' : 'blue';
                },
                backgroundColor: ctx => {
                    const y = ctx.p0.parsed.y;
                    return y > 90 ? 'rgba(255,0,0,0.2)' : 'rgba(0,0,255,0.2)';
                }
            }
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false
    }
    });
    if (dataPoid.some(val => val > 90)) {
        window.alert("Un menu a trop de déchet");
    }

    
}

document.getElementById('ChoixGraphique').addEventListener('change', () => {
    const type = document.getElementById('ChoixGraphique').value;
    const date_debut = document.getElementById('date_debut').value;
    const date_fin=document.getElementById('date_fin').value;
    loadGraphData(type,date_debut,date_fin);
});

document.getElementById('Periode').addEventListener('change', () => {
    const type = document.getElementById('ChoixGraphique').value;
    const date_debut = document.getElementById('date_debut').value;
    const date_fin=document.getElementById('date_fin').value;
    loadGraphData(type,date_debut,date_fin);
});

const DateChoisi=new Date().toISOString().split('T')[0];
loadGraphData('Plastique',DateChoisi,DateChoisi);



</script>

</body>
</html>
