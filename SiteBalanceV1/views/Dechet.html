<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Déchet</title>
</head>
<body>
    <h1>Ajouter un déchet</h1>
    <a href="/Home" class="card-link">Home</a>
    <a href="/Graphique" class="card-link">Graphiques</a>
    <a href="/BDD" class="card-link">BDD</a>
    <a href="/Menu" class="card-link">Menu</a>
    <br><br>

    <form id="formDechet">
        <label for="weight">Poids (kg) :</label>
        <input type="number" id="weight" name="weight" value="0" min="0" max="200" step="0.5"><br><br>

        <label for="choice">Type de déchet :</label>
        <select id="choice" name="choice" required>
            <option value="Plastique">Plastique</option>
            <option value="Organique">Organique</option>
        </select>
        <br><br>
        <div class="balance">
            <input type="radio" id="balance1" name="balance" value="1" checked>
            <label for="balance1">Balance 1</label>

            <input type="radio" id="balance2" name="balance" value="2">
            <label for="balance2">Balance 2</label>
        </div>
        <button type="submit">Ajouter</button>
    </form>

    <form id="formLogout">
        <button type="submit">Se déconnecter</button>
    </form>
    
<button id="exportCsvBtn">Exporter les données en CSV</button>

<script>
document.getElementById('formDechet').addEventListener('submit', async (e) => {
    e.preventDefault();

    const weight = document.getElementById('weight').value;
    const choice = document.getElementById('choice').value;
    const balance = document.querySelector('input[name="balance"]:checked').value;

    const response = await fetch('/AddDataDonneeCollecte', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ weight, choice,balance })
    });

    if (response.ok) {
        alert(`${weight}kg de déchet ${choice} de la balance n°${balance} ajouté !`);
        document.getElementById('weight').value = 0;
    } else {
        alert('Erreur lors de l’ajout.');
    }
});

document.getElementById('formLogout').addEventListener('submit', async (e) => {
    e.preventDefault();
    await fetch('/Logout', { method: 'POST' });
    window.location.href = '/';
});
</script>

</body>
</html>
