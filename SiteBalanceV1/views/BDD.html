<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDD</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-white text-black">

<div class="container py-4">

    <div class="text-center mb-4">
        <h1>BDD</h1>

        <div class="d-flex justify-content-center gap-3 mt-3 flex-wrap">
            <a href="/Home" class="btn btn-outline-primary btn-sm">Home</a>
            <a href="/Graphique" class="btn btn-outline-primary btn-sm">Graphiques</a>
            <a href="/Dechet" class="btn btn-outline-primary btn-sm">Ajout de déchet</a>
            <a href="/Menu" class="btn btn-outline-primary btn-sm">Menu</a>
        </div>
    </div>

    <div class="row g-4 justify-content-center">
        <div class="col-12 col-lg-6">
            <div class="card shadow-sm p-3">
                <h5 class="text-center mb-3">Lire une table</h5>
                <form method="POST" action="/ReadDataBase">
                    <div class="mb-3">
                        <label class="form-label">Base de données</label>
                        <select name="nomTable" id="nomTable" class="form-select">
                            <option value="Utilisateur">Utilisateur</option>
                            <option value="DonneeCollecte">Donnée Collectées</option>
                            <option value="Balance">Balance</option>
                            <option value="menu">Menu</option>
                            <option value="IP_BAN">Ban Liste</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        Afficher
                    </button>
                </form>
            </div>
        </div>
        <div class="col-12 col-lg-6">
            <div class="card shadow-sm p-3">
                <h5 class="text-center mb-3">Ajouter un utilisateur</h5>
                <form method="POST" action="/NewUtilisateur">
                    <div class="mb-2">
                        <input class="form-control" name="Nom" placeholder="Nom" required>
                    </div>
                    <div class="mb-2">
                        <input class="form-control" name="Prenom" placeholder="Prénom" required>
                    </div>
                    <div class="mb-2">
                        <input class="form-control" name="Email" placeholder="Email" required>
                    </div>
                    <div class="mb-2">
                        <input type="password" class="form-control" name="MotDePasse" placeholder="Mot de passe" required>
                    </div>
                    <div class="mb-3">
                        <select class="form-select" id="Role" name="Role" required>
                            <option value="webadmin">SuperAdmin</option>
                            <option value="AdminBDD">Admin Base de Données</option>
                            <option value="ResponsableSelf">Responsable du self</option>
                            <option value="AgentRestauration">Agent de restauration</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success w-100">
                        Créer
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div class="text-center mt-4">
        <form method="POST" action="/Logout">
            <button type="submit" class="btn btn-danger">
                Se déconnecter
            </button>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
