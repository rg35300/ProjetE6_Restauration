<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Menu de la semaine</title>
</head>

<body>

<h1>Menu de la semaine</h1>

<a href="/Home">Home</a>
<a href="/BDD">BDD</a>
<a href="/Dechet">Ajout de déchet</a>
<a href="/Graphique">Graphique</a>

<br><br>

<form id="Menu">

<table border="1">
<thead>
<tr>
    <th>Menu / Jour</th>
    <th>Lundi</th>
    <th>Mardi</th>
    <th>Jeudi</th>
    <th>Vendredi</th>
</tr>
</thead>

<tbody>
    <input type="number" id="NbrMenu" name="NbrMenu" value="0" min="0" max="1000" step="10"><br>
<tr>
<td>Entrée</td>

<td>
<input type="text" id="EntreeLundi" list="entrees-suggestions" onchange="autoFillPoids('Entree','Lundi')" required>
<br>
<input type="number" id="EntreeOrganiqueLundi" value="0" min="0" step="5">
</td>

<td>
<input type="text" id="EntreeMardi" list="entrees-suggestions" onchange="autoFillPoids('Entree','Mardi')" required>
<br>
<input type="number" id="EntreeOrganiqueMardi" value="0" min="0" step="5">
</td>

<td>
<input type="text" id="EntreeJeudi" list="entrees-suggestions" onchange="autoFillPoids('Entree','Jeudi')" required>
<br>
<input type="number" id="EntreeOrganiqueJeudi" value="0" min="0" step="5">
</td>

<td>
<input type="text" id="EntreeVendredi" list="entrees-suggestions" onchange="autoFillPoids('Entree','Vendredi')" required>
<br>
<input type="number" id="EntreeOrganiqueVendredi" value="0" min="0" step="5">
</td>
</tr>

<tr>
<td>Plat</td>

<td>
<input type="text" id="PlatLundi" list="plats-suggestions" onchange="autoFillPoids('Plat','Lundi')" required>
<br>
<input type="number" id="PlatOrganiqueLundi" value="0" min="0" step="5">
</td>

<td>
<input type="text" id="PlatMardi" list="plats-suggestions" onchange="autoFillPoids('Plat','Mardi')" required>
<br>
<input type="number" id="PlatOrganiqueMardi" value="0" min="0" step="5">
</td>

<td>
<input type="text" id="PlatJeudi" list="plats-suggestions" onchange="autoFillPoids('Plat','Jeudi')" required>
<br>
<input type="number" id="PlatOrganiqueJeudi" value="0" min="0" step="5">
</td>

<td>
<input type="text" id="PlatVendredi" list="plats-suggestions" onchange="autoFillPoids('Plat','Vendredi')" required>
<br>
<input type="number" id="PlatOrganiqueVendredi" value="0" min="0" step="5">
</td>
</tr>

<tr>
<td>Dessert</td>

<td>
<input type="text" id="DessertLundi" list="desserts-suggestions" onchange="autoFillPoids('Dessert','Lundi')" required>
<br>
<input type="number" id="DessertOrganiqueLundi" value="0" min="0" step="0.1">
</td>

<td>
<input type="text" id="DessertMardi" list="desserts-suggestions" onchange="autoFillPoids('Dessert','Mardi')" required>
<br>
<input type="number" id="DessertOrganiqueMardi" value="0" min="0" step="0.1">
</td>

<td>
<input type="text" id="DessertJeudi" list="desserts-suggestions" onchange="autoFillPoids('Dessert','Jeudi')" required>
<br>
<input type="number" id="DessertOrganiqueJeudi" value="0" min="0" step="0.1">
</td>

<td>
<input type="text" id="DessertVendredi" list="desserts-suggestions" onchange="autoFillPoids('Dessert','Vendredi')" required>
<br>
<input type="number" id="DessertOrganiqueVendredi" value="0" min="0" step="0.1">
</td>
</tr>

</tbody>
</table>

<br>
<button type="button" onclick="envoyerPlats()">Envoyer</button>

</form>

<p id="resultatentre"></p>
<p id="resultatplat"></p>
<p id="resultdessert"></p>
<p id="resultat"></p>

<datalist id="entrees-suggestions"></datalist>
<datalist id="plats-suggestions"></datalist>
<datalist id="desserts-suggestions"></datalist>

<script>
let menusData = {};

async function loadSuggestions() {
    try {
        const response = await fetch('/GetMenu');
        menusData = await response.json();

        const addOptions = (id, items) => {
            const datalist = document.getElementById(id);
            datalist.innerHTML = "";
            const nomsVus = new Set();
            (items || []).forEach(item => {
                if (!nomsVus.has(item.nom)) {
                    nomsVus.add(item.nom);
                    const option = document.createElement('option');
                    option.value = item.nom;
                    datalist.appendChild(option);
                }
            });
        };

        addOptions('entrees-suggestions', menusData.entrees);
        addOptions('plats-suggestions', menusData.plats);
        addOptions('desserts-suggestions', menusData.desserts);

    } catch (err) {
        console.error("Erreur chargement suggestions:", err);
    }
}

function calculTotalAuto() {
    const nbrMenu = parseFloat(document.getElementById("NbrMenu").value) || 0;

    const entrees = ["EntreeOrganiqueLundi","EntreeOrganiqueMardi","EntreeOrganiqueJeudi","EntreeOrganiqueVendredi"];
    const plats = ["PlatOrganiqueLundi","PlatOrganiqueMardi","PlatOrganiqueJeudi","PlatOrganiqueVendredi"];
    const desserts = ["DessertOrganiqueLundi","DessertOrganiqueMardi","DessertOrganiqueJeudi","DessertOrganiqueVendredi"];

    let totalEntree = 0, totalPlat = 0, totalDessert = 0;

    entrees.forEach(id => totalEntree += parseFloat(document.getElementById(id).value) || 0);
    plats.forEach(id => totalPlat += parseFloat(document.getElementById(id).value) || 0);
    desserts.forEach(id => totalDessert += parseFloat(document.getElementById(id).value) || 0);

    const totalFinal = (totalEntree + totalPlat + totalDessert) * nbrMenu;

    document.getElementById("resultatentre").innerText = `Total des déchets Entrées : ${(totalEntree * nbrMenu).toFixed(2)} g`;
    document.getElementById("resultatplat").innerText = `Total des déchets Plats : ${(totalPlat * nbrMenu).toFixed(2)} g`;
    document.getElementById("resultdessert").innerText = `Total des déchets Desserts : ${(totalDessert * nbrMenu).toFixed(2)} g`;
    document.getElementById("resultat").innerText = `Total général des déchets : ${totalFinal.toFixed(2)} g`;
}

function autoFillPoids(type, jour) {
    const nomInput = document.getElementById(`${type}${jour}`).value.trim();
    const poidsInput = document.getElementById(`${type}Organique${jour}`);

    if (!menusData[type.toLowerCase() + "s"]) return;

    const elements = menusData[type.toLowerCase() + "s"].filter(item => item.nom === nomInput);

    if (elements.length > 0) {
        const moyenne = elements.reduce((acc, e) => acc + parseFloat(e.masse), 0) / elements.length;
        poidsInput.value = moyenne.toFixed(2);
    } 
    calculTotalAuto();
}

window.addEventListener('DOMContentLoaded', async () => {
    await loadSuggestions();

    const inputs = [
        "NbrMenu",
        "EntreeOrganiqueLundi","EntreeOrganiqueMardi","EntreeOrganiqueJeudi","EntreeOrganiqueVendredi",
        "PlatOrganiqueLundi","PlatOrganiqueMardi","PlatOrganiqueJeudi","PlatOrganiqueVendredi",
        "DessertOrganiqueLundi","DessertOrganiqueMardi","DessertOrganiqueJeudi","DessertOrganiqueVendredi"
    ];

    inputs.forEach(id => {
        const elt = document.getElementById(id);
        if (elt) elt.addEventListener('input', calculTotalAuto);
    });
});
</script>

</body>
</html>
