<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu de la semaine</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-white text-black">

<div class="container py-4">

    <div class="text-center mb-4">
        <h1>Menu de la semaine</h1>

        <div class="d-flex justify-content-center gap-3 mt-3">
            <a href="/Home" class="btn btn-outline-primary btn-sm">Home</a>
            <a href="/BDD" class="btn btn-outline-primary btn-sm">BDD</a>
            <a href="/Dechet" class="btn btn-outline-primary btn-sm">Ajout de déchet</a>
            <a href="/Graphique" class="btn btn-outline-primary btn-sm">Graphique</a>
        </div>
    </div>

    <form id="Menu">

        <div class="mb-3 text-center">
            <label class="form-label fw-bold">Nombre de menus</label>
            <input type="number" id="NbrMenu" name="NbrMenu" value="0" min="0" max="1000" step="10"
                   class="form-control w-auto mx-auto text-center">
        </div>

        <div class="table-responsive">
            <table class="table table-bordered table-hover text-center align-middle">

                <thead class="table-dark">
                <tr>
                    <th>Menu / Jour</th>
                    <th>Lundi</th>
                    <th>Mardi</th>
                    <th>Jeudi</th>
                    <th>Vendredi</th>
                </tr>
                </thead>

                <tbody>

                <tr>
                    <td class="fw-bold">Entrée</td>

                    <td>
                        <input class="form-control mb-1" type="text" id="EntreeLundi" list="entrees-suggestions"
                               onchange="autoFillPoids('Entree','Lundi')" required>
                        <input class="form-control form-control-sm" type="number" id="EntreeOrganiqueLundi" value="0">
                    </td>

                    <td>
                        <input class="form-control mb-1" type="text" id="EntreeMardi" list="entrees-suggestions"
                               onchange="autoFillPoids('Entree','Mardi')" required>
                        <input class="form-control form-control-sm" type="number" id="EntreeOrganiqueMardi" value="0">
                    </td>

                    <td>
                        <input class="form-control mb-1" type="text" id="EntreeJeudi" list="entrees-suggestions"
                               onchange="autoFillPoids('Entree','Jeudi')" required>
                        <input class="form-control form-control-sm" type="number" id="EntreeOrganiqueJeudi" value="0">
                    </td>

                    <td>
                        <input class="form-control mb-1" type="text" id="EntreeVendredi" list="entrees-suggestions"
                               onchange="autoFillPoids('Entree','Vendredi')" required>
                        <input class="form-control form-control-sm" type="number" id="EntreeOrganiqueVendredi" value="0">
                    </td>
                </tr>

                <tr>
                    <td class="fw-bold">Plat</td>

                    <td>
                        <input class="form-control mb-1" type="text" id="PlatLundi" list="plats-suggestions"
                               onchange="autoFillPoids('Plat','Lundi')" required>
                        <input class="form-control form-control-sm" type="number" id="PlatOrganiqueLundi" value="0">
                    </td>

                    <td>
                        <input class="form-control mb-1" type="text" id="PlatMardi" list="plats-suggestions"
                               onchange="autoFillPoids('Plat','Mardi')" required>
                        <input class="form-control form-control-sm" type="number" id="PlatOrganiqueMardi" value="0">
                    </td>

                    <td>
                        <input class="form-control mb-1" type="text" id="PlatJeudi" list="plats-suggestions"
                               onchange="autoFillPoids('Plat','Jeudi')" required>
                        <input class="form-control form-control-sm" type="number" id="PlatOrganiqueJeudi" value="0">
                    </td>

                    <td>
                        <input class="form-control mb-1" type="text" id="PlatVendredi" list="plats-suggestions"
                               onchange="autoFillPoids('Plat','Vendredi')" required>
                        <input class="form-control form-control-sm" type="number" id="PlatOrganiqueVendredi" value="0">
                    </td>
                </tr>

                <tr>
                    <td class="fw-bold">Dessert</td>

                    <td>
                        <input class="form-control mb-1" type="text" id="DessertLundi" list="desserts-suggestions"
                               onchange="autoFillPoids('Dessert','Lundi')" required>
                        <input class="form-control form-control-sm" type="number" id="DessertOrganiqueLundi" value="0">
                    </td>

                    <td>
                        <input class="form-control mb-1" type="text" id="DessertMardi" list="desserts-suggestions"
                               onchange="autoFillPoids('Dessert','Mardi')" required>
                        <input class="form-control form-control-sm" type="number" id="DessertOrganiqueMardi" value="0">
                    </td>

                    <td>
                        <input class="form-control mb-1" type="text" id="DessertJeudi" list="desserts-suggestions"
                               onchange="autoFillPoids('Dessert','Jeudi')" required>
                        <input class="form-control form-control-sm" type="number" id="DessertOrganiqueJeudi" value="0">
                    </td>

                    <td>
                        <input class="form-control mb-1" type="text" id="DessertVendredi" list="desserts-suggestions"
                               onchange="autoFillPoids('Dessert','Vendredi')" required>
                        <input class="form-control form-control-sm" type="number" id="DessertOrganiqueVendredi" value="0">
                    </td>
                </tr>

                </tbody>
            </table>
        </div>

        <div class="text-center mt-3">
            <button type="button" class="btn btn-success px-4" onclick="envoyerPlats()">
                Envoyer
            </button>
        </div>

    </form>

    <div class="mt-4 text-center">
        <p id="resultatentre"></p>
        <p id="resultatplat"></p>
        <p id="resultdessert"></p>
        <p id="resultat" class="fw-bold"></p>
    </div>

</div>

<datalist id="entrees-suggestions"></datalist>
<datalist id="plats-suggestions"></datalist>
<datalist id="desserts-suggestions"></datalist>

<script>
</script>

</body>
</html>
