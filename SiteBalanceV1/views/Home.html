<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            overflow-x: hidden;
        }
        .bottom-slider {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 180px;
            overflow: hidden;
            background: white;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.15);
            z-index: 1000;
        }
        .slider-track {
            display: flex;
            width: max-content;
            animation: scrollHorizontal 20s linear infinite;
        }
        .slider-track img {
            width: 250px;
            height: 180px;
            object-fit: cover;
            flex-shrink: 0;
        }
        @keyframes scrollHorizontal {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }
        @media (max-width: 768px) {
            .bottom-slider {
                height: 140px;
            }

            .slider-track img {
                width: 180px;
                height: 140px;
            }
        }
    </style>
</head>

<body class="bg-white text-black">

<div class="container position-relative">
    <div class="d-flex justify-content-center align-items-center" style="min-height: 100vh; padding-bottom: 200px;">

        <div class="col-12 col-md-6 text-center">
            <h1>Bienvenue</h1>

            <div class="bg-primary p-2 rounded mt-3 d-inline-flex justify-content-center gap-3 flex-wrap">
                <a href="/Graphique" class="text-white text-decoration-none">Graphiques</a>
                <a href="/BDD" class="text-white text-decoration-none">BDD</a>
                <a href="/Dechet" class="text-white text-decoration-none">Ajout de déchet</a>
                <a href="/Menu" class="text-white text-decoration-none">Menu</a>
            </div>

            <form method="POST" action="/Logout" class="mt-3">
                <button type="submit" class="btn btn-danger">
                    Se déconnecter
                </button>
            </form>
        </div>
    </div>
</div>

<div class="bottom-slider">
    <div class="slider-track" id="slider-bottom"></div>
</div>

<script>
const images = [
    "/img/salade_img.jpg",
    "/img/omelette.jpg",
    "/img/self.jpg",
    "/img/CantineTable.jpeg",
    "/img/Entre.jpg",
    "/img/Cuisine.png",
];

function Slider(id) {
    const slider = document.getElementById(id);
    const fullList = images.concat(images);
    fullList.forEach(src => {
        const img = document.createElement("img");
        img.src = src;
        slider.appendChild(img);
    });
}

Slider("slider-bottom");
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
